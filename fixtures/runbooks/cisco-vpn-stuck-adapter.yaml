schema_version: "1.0"
runbook_id: "RB-VPN-001"
title: "Reset Stuck Cisco VPN Adapter"
target_os: "windows_11"
tags: ["vpn", "cisco", "network", "adapter", "connectivity"]

trigger_signatures:
  error_codes: ["SEC_E_LOGON_DENIED", "0x8009030C"]
  process_names: ["vpnagent.exe", "vpnui.exe"]
  symptoms: ["VPN connected but no traffic", "Cannot reach intranet", "VPN authentication error"]

pre_checks:
  - id: "check_network_adapter"
    command: "Get-NetAdapter | Select-Object Name, Status"
    expected_output_regex: "Up|Down"

remediation_steps:
  - step: 1
    description: "Flush DNS cache"
    command: "ipconfig /flushdns"
    elevation_required: false
    timeout_seconds: 10
  - step: 2
    description: "Reset the virtual network adapter"
    command: "Restart-NetAdapter -Name 'Cisco AnyConnect'"
    elevation_required: true
    timeout_seconds: 15
  - step: 3
    description: "Renew DHCP lease"
    command: "ipconfig /renew"
    elevation_required: false
    timeout_seconds: 20

verification:
  - command: "Test-NetConnection -ComputerName google.com"
    expected_output_regex: "TcpTestSucceeded : True"

rollback_plan:
  - command: "ipconfig /release && ipconfig /renew"
