# Ubuntu 26.04 LTS runbook — knowledge base owned by @Dev2.
# Target endpoint: Ubuntu 26.04 LTS VM (GNOME 50 / Wayland-only, PipeWire + WirePlumber,
# systemd-resolved, sudo-rs, uutils coreutils). Commands are Wayland-safe: no xrandr,
# setxkbmap, xkill or wmctrl — those only reach XWayland clients on 26.04.
schema_version: '1.1'
runbook_id: RB-AUDIO-003
title: Microphone Does Not Pick Up Any Voice
target_os: ubuntu_26_04
environment: vm-safe
source_case: UB-008
tags:
- audio
- microphone
- mic
- input
- source
- muted
- recording
trigger_signatures:
  symptoms:
  - My microphone does not pick up my voice
  - the mic is not working in calls
  - microphone input is muted or the wrong input device is selected
  error_codes: []
  process_names: []
remediation_steps:
- step: 1
  description: Unmute the default audio input
  command: wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 0
  elevation_required: false
  timeout_seconds: 10
- step: 2
  description: Raise the input volume to a usable level
  command: wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 0.80
  elevation_required: false
  timeout_seconds: 10
verification:
- command: wpctl get-volume @DEFAULT_AUDIO_SOURCE@
  expected_output_regex: 'Volume: 0\.8'
rollback_plan: []
