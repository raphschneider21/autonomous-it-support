# Ubuntu 26.04 LTS runbook — knowledge base owned by @Dev2.
# Target endpoint: Ubuntu 26.04 LTS VM (GNOME 50 / Wayland-only, PipeWire + WirePlumber,
# systemd-resolved, sudo-rs, uutils coreutils). Commands are Wayland-safe: no xrandr,
# setxkbmap, xkill or wmctrl — those only reach XWayland clients on 26.04.
schema_version: '1.1'
runbook_id: RB-APT-004
title: Unable to Locate Package (Stale Package Lists)
target_os: ubuntu_26_04
environment: vm-safe
source_case: UB-016
tags:
- apt
- locate
- package-lists
- not-found
- update
- packages
trigger_signatures:
  symptoms:
  - 'E: Unable to locate package when installing'
  - apt cannot find the package I want to install
  - command not found and apt does not know the package
  error_codes:
  - 'E: Unable to locate package'
  process_names: []
remediation_steps:
- step: 1
  description: Refresh the package lists from the configured repositories
  command: sudo apt update
  elevation_required: true
  timeout_seconds: 120
verification:
- command: apt-cache policy
  expected_output_regex: release|500 http|Package files
rollback_plan: []
