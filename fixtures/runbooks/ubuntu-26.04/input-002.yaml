# Ubuntu 26.04 LTS runbook — knowledge base owned by @Dev2.
# Target endpoint: Ubuntu 26.04 LTS VM (GNOME 50 / Wayland-only, PipeWire + WirePlumber,
# systemd-resolved, sudo-rs, uutils coreutils). Commands are Wayland-safe: no xrandr,
# setxkbmap, xkill or wmctrl — those only reach XWayland clients on 26.04.
schema_version: '1.1'
runbook_id: RB-INPUT-002
title: Touchpad Dead After Resuming From Sleep
target_os: ubuntu_26_04
environment: physical-only
source_case: UB-022
tags:
- touchpad
- suspend
- sleep
- resume
- psmouse
- input
- pointer
trigger_signatures:
  symptoms:
  - Touchpad stopped working after the laptop woke from sleep
  - the touchpad does not respond after suspend
  - the pointer does not move after resuming
  error_codes: []
  process_names: []
remediation_steps:
- step: 1
  description: Unload the stuck touchpad kernel module
  command: sudo modprobe -r psmouse
  elevation_required: true
  timeout_seconds: 20
- step: 2
  description: Reload the touchpad kernel module
  command: sudo modprobe psmouse
  elevation_required: true
  timeout_seconds: 20
verification:
- command: lsmod
  expected_output_regex: psmouse
- command: libinput list-devices
  expected_output_regex: Touchpad
rollback_plan: []
