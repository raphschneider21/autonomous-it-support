# Ubuntu 26.04 LTS runbook — knowledge base owned by @Dev2.
# Target endpoint: Ubuntu 26.04 LTS VM (GNOME 50 / Wayland-only, PipeWire + WirePlumber,
# systemd-resolved, sudo-rs, uutils coreutils). Commands are Wayland-safe: no xrandr,
# setxkbmap, xkill or wmctrl — those only reach XWayland clients on 26.04.
schema_version: '1.1'
runbook_id: RB-CUPS-001
title: Print Queue Stuck and Nothing Prints (CUPS Backlogged)
target_os: ubuntu_26_04
environment: vm-safe
source_case: UB-029
tags:
- printer
- printing
- queue
- cups
- stuck
- spooler
- jobs
trigger_signatures:
  symptoms:
  - Print jobs are stuck in the queue and nothing prints
  - the printer queue will not clear
  - documents sit in the print queue and never come out
  error_codes: []
  process_names: []
pre_checks:
- id: check_cups_state
  command: systemctl is-active cups
  expected_output_regex: active|inactive|failed
remediation_steps:
- step: 1
  description: Cancel every queued print job
  command: cancel -a
  elevation_required: false
  timeout_seconds: 20
- step: 2
  description: Restart the CUPS printing service
  command: sudo systemctl restart cups
  elevation_required: true
  timeout_seconds: 30
verification:
- command: systemctl is-active cups
  expected_output_regex: ^active
- command: lpstat -o
  expected_output_regex: ^$
rollback_plan: []
