# Ubuntu 26.04 LTS runbook — knowledge base owned by @Dev2.
# Target endpoint: Ubuntu 26.04 LTS VM (GNOME 50 / Wayland-only, PipeWire + WirePlumber,
# systemd-resolved, sudo-rs, uutils coreutils). Commands are Wayland-safe: no xrandr,
# setxkbmap, xkill or wmctrl — those only reach XWayland clients on 26.04.
schema_version: '1.1'
runbook_id: RB-DISPLAY-002
title: Screen Resolution Is Wrong and Everything Looks Blurry
target_os: ubuntu_26_04
environment: vm-safe
source_case: UB-025
tags:
- display
- resolution
- blurry
- scaling
- gdctl
- screen
- monitor
trigger_signatures:
  symptoms:
  - The screen resolution is wrong or everything looks blurry
  - everything on screen looks stretched or fuzzy
  - the display is running at the wrong resolution
  error_codes: []
  process_names: []
parameters:
- name: connector
  description: Connector name from `gdctl show` (Virtual-1 on a VM)
  default: Virtual-1
- name: mode
  description: Mode identifier to apply
  default: 1920x1080@60.000
remediation_steps:
- step: 1
  description: List the available modes for the attached monitors
  command: gdctl show --verbose
  elevation_required: false
  timeout_seconds: 15
- step: 2
  description: Apply the correct resolution to the monitor
  command: gdctl set --logical-monitor --monitor {connector} --mode {mode}
  elevation_required: false
  timeout_seconds: 30
verification:
- command: gdctl show
  expected_output_regex: 1920x1080
rollback_plan: []
