# Ubuntu 26.04 LTS runbook — knowledge base owned by @Dev2.
# Target endpoint: Ubuntu 26.04 LTS VM (GNOME 50 / Wayland-only, PipeWire + WirePlumber,
# systemd-resolved, sudo-rs, uutils coreutils). Commands are Wayland-safe: no xrandr,
# setxkbmap, xkill or wmctrl — those only reach XWayland clients on 26.04.
schema_version: '1.1'
runbook_id: RB-AUDIO-001
title: No Sound At All After an Update (PipeWire Stack Stalled)
target_os: ubuntu_26_04
environment: vm-safe
source_case: UB-006
tags:
- audio
- sound
- silent
- pipewire
- wireplumber
- no-sound
trigger_signatures:
  symptoms:
  - There is no sound at all after an update
  - no audio from the speakers or the headphones
  - sound stopped working completely
  error_codes: []
  process_names: []
pre_checks:
- id: check_audio_server
  command: systemctl --user is-active pipewire
  expected_output_regex: active|inactive|failed
remediation_steps:
- step: 1
  description: Restart the PipeWire audio stack for the logged-in user
  command: systemctl --user restart wireplumber pipewire pipewire-pulse
  elevation_required: false
  timeout_seconds: 30
verification:
- command: systemctl --user is-active pipewire
  expected_output_regex: ^active
- command: wpctl status
  expected_output_regex: Audio
rollback_plan: []
