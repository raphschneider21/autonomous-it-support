# Ubuntu 26.04 LTS runbook — knowledge base owned by @Dev2.
# Target endpoint: Ubuntu 26.04 LTS VM (GNOME 50 / Wayland-only, PipeWire + WirePlumber,
# systemd-resolved, sudo-rs, uutils coreutils). Commands are Wayland-safe: no xrandr,
# setxkbmap, xkill or wmctrl — those only reach XWayland clients on 26.04.
schema_version: '1.1'
runbook_id: RB-AUDIO-002
title: Sound Plays Through Speakers Instead of Headphones
target_os: ubuntu_26_04
environment: physical-only
source_case: UB-007
tags:
- audio
- headphones
- speakers
- output
- sink
- wrong-device
trigger_signatures:
  symptoms:
  - No sound through headphones, it still plays on the speakers
  - headphones are plugged in but audio comes out of the speakers
  - the wrong audio output device is selected
  error_codes: []
  process_names: []
parameters:
- name: sink_id
  description: WirePlumber node ID of the headphone sink, from `wpctl status`
  default: '47'
remediation_steps:
- step: 1
  description: List the available audio sinks and their IDs
  command: wpctl status
  elevation_required: false
  timeout_seconds: 15
- step: 2
  description: Make the headphone sink the default output
  command: wpctl set-default {sink_id}
  elevation_required: false
  timeout_seconds: 10
verification:
- command: pactl info
  expected_output_regex: 'Default Sink: .+'
rollback_plan: []
