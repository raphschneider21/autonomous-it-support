# Ubuntu 26.04 LTS runbook — knowledge base owned by @Dev2.
# Target endpoint: Ubuntu 26.04 LTS VM (GNOME 50 / Wayland-only, PipeWire + WirePlumber,
# systemd-resolved, sudo-rs, uutils coreutils). Commands are Wayland-safe: no xrandr,
# setxkbmap, xkill or wmctrl — those only reach XWayland clients on 26.04.
schema_version: '1.1'
runbook_id: RB-DNS-001
title: Connected to the Network but No Pages Load (Stale Resolver Cache)
target_os: ubuntu_26_04
environment: vm-safe
source_case: UB-002
tags:
- dns
- resolver
- internet
- connectivity
- resolvectl
- systemd-resolved
- network
trigger_signatures:
  symptoms:
  - Wi-Fi is connected but pages will not load, no internet
  - network shows connected but no websites open
  - browser cannot load any page although the connection is up
  error_codes: []
  process_names: []
pre_checks:
- id: check_link_state
  command: nmcli -t -f STATE general
  expected_output_regex: connected|disconnected
remediation_steps:
- step: 1
  description: Flush the systemd-resolved DNS cache
  command: sudo resolvectl flush-caches
  elevation_required: true
  timeout_seconds: 10
- step: 2
  description: Restart the DNS resolver service
  command: sudo systemctl restart systemd-resolved
  elevation_required: true
  timeout_seconds: 30
verification:
- command: systemctl is-active systemd-resolved
  expected_output_regex: ^active
- command: ping -c 4 1.1.1.1
  expected_output_regex: 0% packet loss
rollback_plan:
- command: sudo systemctl restart systemd-resolved
