# Ubuntu 26.04 LTS runbook — knowledge base owned by @Dev2.
# Target endpoint: Ubuntu 26.04 LTS VM (GNOME 50 / Wayland-only, PipeWire + WirePlumber,
# systemd-resolved, sudo-rs, uutils coreutils). Commands are Wayland-safe: no xrandr,
# setxkbmap, xkill or wmctrl — those only reach XWayland clients on 26.04.
schema_version: '1.1'
runbook_id: RB-APT-003
title: Unmet Dependencies Block a Package Installation
target_os: ubuntu_26_04
environment: vm-safe
source_case: UB-015
tags:
- apt
- dependencies
- unmet
- broken-packages
- install
- packages
trigger_signatures:
  symptoms:
  - I cannot install a package, dependency errors
  - apt reports unmet dependencies
  - installation fails with broken packages
  error_codes:
  - 'E: Unmet dependencies'
  - have unmet dependencies
  process_names: []
remediation_steps:
- step: 1
  description: Let apt repair the broken dependency set
  command: sudo apt-get --fix-broken install -y
  elevation_required: true
  timeout_seconds: 300
verification:
- command: sudo apt-get check
  expected_output_regex: Reading state information
- command: sudo dpkg --audit
  expected_output_regex: ^$|No packages are in an inconsistent state
rollback_plan: []
