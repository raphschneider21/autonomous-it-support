# Ubuntu 26.04 LTS runbook — knowledge base owned by @Dev2.
# Target endpoint: Ubuntu 26.04 LTS VM (GNOME 50 / Wayland-only, PipeWire + WirePlumber,
# systemd-resolved, sudo-rs, uutils coreutils). Commands are Wayland-safe: no xrandr,
# setxkbmap, xkill or wmctrl — those only reach XWayland clients on 26.04.
schema_version: '1.1'
runbook_id: RB-DNS-002
title: Temporary Failure in Name Resolution
target_os: ubuntu_26_04
environment: vm-safe
source_case: UB-004
tags:
- dns
- name-resolution
- hostname
- resolver
- eai-again
- network
trigger_signatures:
  symptoms:
  - Temporary failure in name resolution when opening websites
  - hostnames cannot be resolved
  - apt and the browser both fail to resolve domain names
  error_codes:
  - EAI_AGAIN
  - Temporary failure in name resolution
  process_names: []
remediation_steps:
- step: 1
  description: Restart the systemd-resolved name resolver
  command: sudo systemctl restart systemd-resolved
  elevation_required: true
  timeout_seconds: 30
verification:
- command: systemctl is-active systemd-resolved
  expected_output_regex: ^active
- command: resolvectl query ubuntu.com
  expected_output_regex: 'ubuntu\.com:'
rollback_plan:
- command: sudo systemctl restart systemd-resolved
