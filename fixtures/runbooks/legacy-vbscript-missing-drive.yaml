schema_version: "1.0"
runbook_id: "RB-LEGACY-001"
title: "Fix Legacy VBS Script Missing Network Drive"
target_os: "windows_11"
tags: ["legacy", "vbscript", "network-drive", "mapped-drive", "error-76"]

trigger_signatures:
  error_codes: ["ERROR_76", "0x8007004B"]
  process_names: ["wscript.exe", "cscript.exe"]
  symptoms: ["Legacy application error 76", "Path not found", "Network drive missing", "VBS script fails"]

pre_checks:
  - id: "check_mapped_drives"
    command: "net use"
    expected_output_regex: "OK|Disconn"

remediation_steps:
  - step: 1
    description: "Map the required network drive"
    command: "net use Z: \\\\fileserver\\shared /persistent:yes"
    elevation_required: false
    timeout_seconds: 15
  - step: 2
    description: "Verify drive mapping"
    command: "net use"
    elevation_required: false
    timeout_seconds: 10

verification:
  - command: "net use Z:"
    expected_output_regex: "OK"

rollback_plan:
  - command: "net use Z: /delete"
